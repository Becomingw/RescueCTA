name: rescuecta
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python>=3.11

  # PyTorch with CUDA (requires torchvision>=0.11 for VGG19_Weights)
  # For CUDA 13.0, use pytorch-cuda=12.1 (forward compatible)
  - pytorch>=2.0
  - torchvision>=0.15
  - pytorch-cuda=12.1

  # Core scientific computing
  - numpy>=1.20
  - scipy>=1.7

  # Image processing
  - pillow>=8.0
  - scikit-image>=0.18

  # Configuration and logging
  - pyyaml>=5.4
  - tqdm>=4.60
  - tensorboard>=2.5
  - pytest>=8.0

  # pip dependencies
  - pip
  - pip:
      # OpenCV (easier to install via pip)
      - opencv-python>=4.5

      # Optional: DICOM support
      - pydicom>=2.2

      # Medical image volume I/O
      - SimpleITK>=2.1
      - nibabel>=5.0
